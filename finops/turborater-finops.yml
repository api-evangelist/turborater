meters:
- name: subscription
  description: Base TurboRater subscription; contact-sales, driven by products, lines, and states.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - product
- name: carrier_connections
  description: Number of enabled carrier connections/appointments feeding comparative rates.
  unit: connections
  aggregation: max
  dimensions:
  - account
  - carrier
- name: rating_api_quotes
  description: Comparative quote requests made through the rating API by an integration partner.
  unit: quotes
  aggregation: sum
  dimensions:
  - account
  - integration
principles:
- name: Visibility
  description: Because pricing is contract-based, track the base subscription, enabled lines/states/carrier connections, and API quote volume against the ITC/Zywave agreement rather than a usage dashboard.
- name: Allocation
  description: Map subscriptions and API integrations to the agency, brand, or lead-source they serve so cost ties to revenue-producing quoting.
- name: Optimization
  description: Right-size enabled carrier connections and states to those actually quoted; consolidate quoting into TurboRater to avoid duplicate rater subscriptions; negotiate quote-volume terms for high-throughput aggregator use.
- name: Accountability
  description: Assign an owner for the ITC/Zywave relationship; review the subscription and any quote-volume charges each renewal against actual quoting activity.
