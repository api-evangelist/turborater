name: TurboRater
kind: company
description: >-
  TurboRater is a personal lines comparative insurance rating platform from
  Insurance Technologies Corporation (ITC), now part of Zywave (marketed within
  Zywave Sales Cloud). It lets agencies, carriers, lead providers, and online
  aggregators quote auto, homeowners, condominium, renters, dwelling fire, and
  motorcycle coverage from 200+ carriers in a single workflow. ITC exposes a
  web service-based rating API (a service-oriented version of TurboRater it
  first offered to third parties in 2010, extended with a homeowner rating API
  in 2016) that returns real-time rates from hundreds of carriers and can pull
  quote data as XML or ITC's proprietary Turbo Tags (TT2) format, plus a
  real-time bridge that hands a completed quote into an agency point-of-sale or
  management system. The rating API is partner- and subscription-gated - access,
  carrier appointments, and the developer documentation are provisioned through
  ITC/Zywave sales rather than a public developer portal, so the specific
  endpoints below are honestly modeled from published behavior, not copied from
  a public API reference.
