description: >-
  FinOps view of TurboRater (ITC / Zywave) spend. TurboRater is sold as a
  subscription, and the rating API is provisioned to partners under a
  subscription plus, where applicable, quote-volume terms negotiated with
  ITC/Zywave sales. There is no public self-serve price and no published
  per-quote rate, so cost visibility comes from the partner contract rather than
  a metered usage dashboard. The dominant cost drivers are the base subscription,
  the number of lines/states/carrier connections enabled, and, for API partners,
  integration and comparative-quote volume.
notes: >-
  Per-unit and per-quote rates are contact-sales and not reconciled here. Model
  spend from the ITC/Zywave partner agreement. Endpoints are modeled
  (endpointsModeled=true), not published.
